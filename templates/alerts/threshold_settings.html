{% extends "registry/model_tab_shell.html" %}

{% block tab_content %}
<div class="card" style="max-width: 650px; margin: 0 auto;">
    <h3>Threshold Profile Configuration</h3>
    <p style="color: var(--text-secondary); font-size: 0.875rem; margin-top: 0.25rem;">
        Configure detection sensitivity thresholds for {{ ml_model.name }}.
    </p>

    {% if messages %}
        <div style="margin-top: 1rem;">
            {% for message in messages %}
                <div class="badge badge-healthy" style="display: block; padding: 0.5rem; margin-bottom: 0.5rem;">{{ message }}</div>
            {% endfor %}
        </div>
    {% endif %}

    <form method="post" style="margin-top: 1.5rem; display: flex; flex-direction: column; gap: 1rem;">
        {% csrf_token %}
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            <div>
                <label style="display: block; font-size: 0.875rem; margin-bottom: 0.25rem;">KS p-value Threshold</label>
                <input type="number" step="0.01" name="ks_p_value_threshold" value="{{ profile.ks_p_value_threshold }}" class="btn btn-secondary" style="width: 100%; text-align: left;" required>
            </div>
            <div>
                <label style="display: block; font-size: 0.875rem; margin-bottom: 0.25rem;">Chi2 p-value Threshold</label>
                <input type="number" step="0.01" name="chi2_p_value_threshold" value="{{ profile.chi2_p_value_threshold }}" class="btn btn-secondary" style="width: 100%; text-align: left;" required>
            </div>
            <div>
                <label style="display: block; font-size: 0.875rem; margin-bottom: 0.25rem;">PSI Threshold</label>
                <input type="number" step="0.05" name="psi_threshold" value="{{ profile.psi_threshold }}" class="btn btn-secondary" style="width: 100%; text-align: left;" required>
            </div>
            <div>
                <label style="display: block; font-size: 0.875rem; margin-bottom: 0.25rem;">JS Divergence Threshold</label>
                <input type="number" step="0.05" name="js_threshold" value="{{ profile.js_threshold }}" class="btn btn-secondary" style="width: 100%; text-align: left;" required>
            </div>
            <div>
                <label style="display: block; font-size: 0.875rem; margin-bottom: 0.25rem;">Accuracy Drop Threshold</label>
                <input type="number" step="0.01" name="accuracy_drop_threshold" value="{{ profile.accuracy_drop_threshold }}" class="btn btn-secondary" style="width: 100%; text-align: left;" required>
            </div>
            <div>
                <label style="display: block; font-size: 0.875rem; margin-bottom: 0.25rem;">Health Warning (0-100)</label>
                <input type="number" name="health_warning_threshold" value="{{ profile.health_warning_threshold }}" class="btn btn-secondary" style="width: 100%; text-align: left;" required>
            </div>
        </div>

        <button type="submit" class="btn btn-primary" style="margin-top: 1rem;">Save Threshold Profile</button>
    </form>
</div>
{% endblock %}
