{% extends "base.html" %}

{% block header_title %}404 Page Not Found{% endblock %}

{% block content %}
<div class="card" style="text-align: center; padding: 3rem;">
    <h1 style="font-size: 3rem; color: var(--color-warning);">404</h1>
    <h3 style="margin-top: 1rem;">Page Not Found</h3>
    <p style="color: var(--text-secondary); margin-top: 0.5rem;">
        The page you are looking for does not exist.
    </p>
    <a href="{% url 'dashboard:index' %}" class="btn btn-primary" style="margin-top: 1.5rem;">Return to Dashboard</a>
</div>
{% endblock %}
