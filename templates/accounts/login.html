{% extends "base.html" %}

{% block header_title %}Login{% endblock %}

{% block content %}
<div class="card" style="max-width: 420px; margin: 2rem auto;">
    <h3>Sign In to DriftGuard</h3>
    
    {% if messages %}
        <div style="margin-top: 1rem;">
            {% for message in messages %}
                <div class="badge badge-critical" style="display: block; text-align: center; width: 100%; margin-bottom: 0.5rem; padding: 0.5rem;">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
    {% endif %}

    <form method="post" style="margin-top: 1.5rem; display: flex; flex-direction: column; gap: 1rem;">
        {% csrf_token %}
        <div>
            <label style="display: block; font-size: 0.875rem; margin-bottom: 0.25rem;">Username</label>
            <input type="text" name="username" class="btn btn-secondary" style="width: 100%; text-align: left;" required autofocus>
        </div>
        <div>
            <label style="display: block; font-size: 0.875rem; margin-bottom: 0.25rem;">Password</label>
            <input type="password" name="password" class="btn btn-secondary" style="width: 100%; text-align: left;" required>
        </div>
        <button type="submit" class="btn btn-primary" style="margin-top: 0.5rem;">Sign In</button>
    </form>
</div>
{% endblock %}
